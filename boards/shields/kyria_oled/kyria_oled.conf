#
# Settings of the Kyria OLED status screen. They sit here and not in
# Kconfig.defconfig because the keyboard shield comes first in the shield list,
# so its defaults win over ours. An assignment beats every default.

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# The screen is never blanked: after a while without key presses the clock
# takes over and dims the panel itself.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# One pass renders the whole screen, and LVGL gets the heap that is proven on
# the besimboard.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# The OLED and the RGB LEDs share the switched 3.3 V rail of the nice!nano.
# With this option on, turning the LEDs off cuts the rail and the OLED with it,
# and the panel stays dark until the next reset. The half without this shield
# keeps ZMK's default.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

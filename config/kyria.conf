# Kyria — splitkb Kyria rev3 (nice!nano v2 on both halves, a 0.96" SSD1306 OLED on
# the left half, RGB LEDs on both). One conf for every revision: the shield names
# kyria_rev3_left, kyria_rev2_left and kyria_left all resolve to "kyria".

CONFIG_ZMK_KEYBOARD_NAME="Kyria"

# Rotary encoders, ZMK's documented setup. (Do NOT switch to
# CONFIG_EC11_TRIGGER_OWN_THREAD: that runs the whole key/HID/Bluetooth chain on a
# cooperative 1 KB-stack thread and froze the besimboard when the encoder was used.)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# The OLED status screen is the oled_besim shield (boards/shields/oled_besim), listed
# after kyria_rev3_left in build.yaml. It enables CONFIG_ZMK_DISPLAY itself, so the
# right half, which has no display, stays without one.

# RGB LEDs: 31 per half on a rev3 (25 per-key, 6 underglow; the chain length is set
# in kyria.keymap). They start switched off and go dark when the keyboard is idle;
# LOWER + FN + H toggles them. The brightness is capped at 40 %: 31 LEDs at full
# white draw more than the nice!nano's regulator should supply.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40

# Deep sleep after 30 minutes without a key press (never while USB power is
# present). Dark WS2812 LEDs still draw current, so without sleep a battery would
# last a day or two. A key press wakes the half, and waking is a reset: the clock on
# the OLED loses its time and shows --:-- until it is set again. CONFIG_ZMK_SLEEP=n
# trades the battery for the time.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Smooth encoder volume over Bluetooth.
# ZMK queues at most 5 media-key reports by default and drops the OLDEST one when
# a fast spin overflows the queue; a dropped "release" leaves volume-up held on
# macOS, which auto-repeats it — hence the jumps to 50%/100%. 32 absorbs a whole
# spin; together with the 10 ms encoder tap in the keymap the queue never overflows.
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=32

# ZMK Studio (zmk.studio, over USB or Bluetooth; the left half runs it).
# FN + O unlocks the keyboard, as on the besimboard; it stays unlocked through 30
# minutes of Studio inactivity and does not re-lock when Studio disconnects. The
# right half has no Studio and only warns about these two lines.
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=1800
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

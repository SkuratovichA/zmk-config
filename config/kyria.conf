# Kyria — splitkb Kyria rev3 (nice!nano v2 on both halves, a 0.96" SSD1306 OLED on
# the left half, RGB LEDs on both). One conf for every revision: the shield names
# kyria_rev3_left, kyria_rev2_left and kyria_left all resolve to "kyria".

CONFIG_ZMK_KEYBOARD_NAME="Kyria"

# No encoders: the encoder positions carry ordinary switches. The keymap switches
# the shield's encoder and sensors nodes off, which keeps the EC11 driver out of
# the build (ZMK would otherwise link it in for the declared encoder pins). If
# encoders are ever fitted: drop that block from the keymap, add sensor-bindings
# as in splitkb_aurora_lily58.keymap, and set CONFIG_EC11=y and
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y here (never CONFIG_EC11_TRIGGER_OWN_THREAD,
# which froze the besimboard).

# The OLED status screen is the kyria_oled shield (boards/shields/kyria_oled), listed
# after kyria_rev3_left in build.yaml. It enables CONFIG_ZMK_DISPLAY itself, so the
# right half, which has no display, stays without one.

# RGB LEDs: 31 per half on a rev3 (6 underglow, 25 per-key; the chain length and
# the LED nodes are in kyria.keymap). ZMK's underglow effects run on the six
# underglow LEDs only; every pressed key lights its own LED in a random colour and
# fades out over a second (src/shared/key_rgb.c). Both are on at first boot;
# LOWER + FN + H cycles off, underglow, per-key, both, on both halves, and the
# choice is kept across reboots. The underglow goes dark when the keyboard is
# idle. The brightness is capped at 40 %: 31 LEDs at full white draw more than
# the nice!nano's regulator should supply.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40

# No deep sleep: the halves run on 3000 mAh cells, so the keyboard stays awake
# and the clock on the OLED keeps its time. Dark WS2812 LEDs still draw about
# 25 mA per half whenever their power rail is on, which is always on the left
# (the OLED shares the rail) and during LED activity on the right; count on days
# to a couple of weeks per charge, not months. CONFIG_ZMK_SLEEP=y brings deep
# sleep back (a key press wakes the half, which is a reset: the time is lost).
CONFIG_ZMK_SLEEP=n

# Radio: full transmit power and ZMK's newer connection settings, for a steadier
# link at the cost of some battery.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ZMK Studio (zmk.studio, over USB or Bluetooth; the left half runs it).
# FN + O unlocks the keyboard, as on the besimboard; it stays unlocked through 30
# minutes of Studio inactivity and does not re-lock when Studio disconnects. The
# right half has no Studio and only warns about these two lines.
CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=1800
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

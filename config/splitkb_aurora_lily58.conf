# besimboard — splitkb Aurora Lily58 (nice!nano v2 + nice!view on both halves)

CONFIG_ZMK_KEYBOARD_NAME="besimboard"

# Rotary encoder. Sampled on its own thread so Bluetooth back-pressure on the
# system work queue cannot make the driver miss quadrature edges.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=10

# nice!view display (custom status screen: shield nice_view_besim in boards/shields)
CONFIG_ZMK_DISPLAY=y

# Smooth encoder volume over Bluetooth.
# ZMK queues at most 5 consumer (media key) reports by default and drops the
# OLDEST one when a fast spin overflows the queue; a dropped "release" leaves
# volume-up held on macOS, which auto-repeats it — hence the jumps to 50%/100%.
# Queue whole bursts and let more BLE packets be in flight.
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=32
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_ATT_TX_COUNT=10
# Zephyr requires more HCI event RX buffers than ACL TX buffers (default is 10).
CONFIG_BT_BUF_EVT_RX_COUNT=16

# Underglow stays off (not populated)
# CONFIG_ZMK_RGB_UNDERGLOW=y
